<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>Booking cancelled</title></head>
  <body style="font-family: Georgia, serif; color: #1a1a1a; line-height: 1.5;">
    <h1 style="font-weight: normal;">{{hotelName}}</h1>
    <p>Hi {{guestName}},</p>
    <p>Your booking has been cancelled.</p>
    <ul>
      <li>Booking ID: {{bookingId}}</li>
      <li>Room: {{roomNumber}}</li>
      <li>Check-in: {{checkIn}}</li>
      <li>Check-out: {{checkOut}}</li>
    </ul>
    <p>If this was unexpected, please contact the front desk.</p>
    <p>{{hotelName}}</p>
  </body>
</html>
